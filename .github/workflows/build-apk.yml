name: Build Quran Studio APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          cmdline-tools-version: 11.0
      - name: Build APK
        run: |
          ls -la
          echo "index.html exists:"
          ls -lh index.html manifest.json
          # Your build steps here - Gradle will use installed SDK
          # Do NOT run sdkmanager tools - that package is gone
