name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # NO setup-android step here - GitHub runner already has Android SDK
      # This was the step that was failing with 'tools' error

      - name: Install deps
        run: npm install

      # --- MAKE PHONE ICON FROM CODE (SVG -> PNG) ---
      - name: Make Icon From SVG Code
        run: |
          npm install -g @capacitor/assets sharp
          mkdir -p assets
          node -e "const sharp=require('sharp'); sharp('assets/icon.svg').png().toFile('assets/icon.png').then(()=>console.log('icon.png made'))"
          npx @capacitor/assets generate --iconBackgroundColor '#1E7A4C' --iconBackgroundColorDark '#1E7A4C' --splashBackgroundColor '#1E7A4C' --splashBackgroundColorDark '#1E7A4C'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        env:
          ANDROID_HOME: /usr/lib/android-sdk
          ANDROID_SDK_ROOT: /usr/lib/android-sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Studio-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
