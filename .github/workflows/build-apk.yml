name: Build Quran Studio APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # DO NOT use setup-android@v3 - runner already has SDK
      - name: Use Preinstalled SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          ls /usr/local/lib/android/sdk/cmdline-tools/
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Create Android Project
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/quranstudio/app
          cp index.html app/src/main/assets/index.html
          cp manifest.json app/src/main/assets/manifest.json || true

          cat > app/build.gradle <<'EOF'
          apply plugin: 'com.android.application'
          android {
              namespace 'com.quranstudio.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.quranstudio.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
          }
          dependencies { }
          EOF

          cat > build.gradle <<'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.4' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > settings.gradle <<'EOF'
          include ':app'
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <application android:label="Quran Studio" android:theme="@android:style/Theme.Material.Light.NoActionBar" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/quranstudio/app/MainActivity.java <<'EOF'
          package com.quranstudio.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          public class MainActivity extends Activity {
              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  WebView w = new WebView(this);
                  WebSettings s = w.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  w.setWebChromeClient(new android.webkit.WebChromeClient());
                  setContentView(w);
                  w.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF
          ls -R

      - name: Build APK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          curl -s "https://get.sdkman.io" | bash || true
          gradle wrapper --gradle-version 8.5 || wget https://services.gradle.org/distributions/gradle-8.5-bin.zip -O gradle.zip && unzip -q gradle.zip && ./gradle-8.5/bin/gradle wrapper --gradle-version 8.5 || true
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Studio-APK
          path: app/build/outputs/apk/debug/app-debug.apk
